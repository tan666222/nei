
name: GKI Kernel Build
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      make_release:
        required: true
        type: boolean
        default: true
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      # kernelsu_branch_other:
      #   required: false
      #   type: string
      revision:
        required: false
        type: string
      version:
        required: false
        type: string
      use_zram:
        required: false
        type: boolean
        default: false
      use_kpm:
        required: false
        type: boolean
        default: false
      supp_op:
        required: true
        type: boolean
        default: false
      fast:
        required: false
        type: boolean
        default: false
      onlyAk3:
        required: true
        type: boolean
        default: true
      build_time:
        required: false
        type: string
      Latest:
        required: true
        type: boolean
        default: true
      Specified:
        required: true
        type: boolean
        default: true
      susfs:
        required: true
        type: boolean
        default: true
      banben:
        required: false
        type: string
      zeromou:
        required: false
        type: boolean
        default: false
      nomou:
        required: false
        type: boolean
        default: false
      
       

jobs:
  build-kernel-kernelsu-susfs:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Maximize Build Space
        uses: AdityaGarg8/remove-unwanted-software@v5
        #if: ${{ inputs.Specified }}
        with:
          remove-dotnet: 'true'          # Frees ~2 GB
          remove-android: 'true'         # Frees ~9 GB
          remove-haskell: 'true'         # Frees ~5.2 GB
          remove-codeql: 'true'          # Frees ~5.4 GB
          remove-docker-images: 'true'   # Frees ~3.2 GB
          remove-large-packages: 'true'  # Frees ~3.1 GB
          remove-swapfile: 'true'        # Frees ~4 GB
          remove-cached-tools: 'false'   # Avoid unless confirmed safe
          verbose: 'true'                # Enable detailed logging
      - name: Free disk space
        #if: ${{ inputs.Specified }}
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
         
          sudo apt clean
      - name: 克隆自己的仓库
        uses: actions/checkout@v4
        with:
          ref: dev           # 指定 dev 分支
          path: ./           # 克隆到当前目录（$GITHUB_WORKSPACE）
          fetch-depth: 1     # 只克隆最新提交，加快速度
      - name: 设定 CONFIG 环境变量
        run: |
          # Set CONFIG dynamically based on inputs values
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"

          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

          echo "CONFIG set to: $CONFIG"

      # Install ccache
      - name: 安装 依赖
        if: ${{ inputs.Specified }}
        run: sudo apt update && sudo apt upgrade -y && sudo apt install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves

      - name: 配置 ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 从缓存中还原ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

      - name: 缓存工具链
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-v1

      # Step 2: Download toolchain if cache was not found
      - name: 下载工具链（如果未找到缓存）
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-build-2024
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg

      - name: 设置环境变量
        run: |
          echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool" >> $GITHUB_ENV
          echo "MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py" >> $GITHUB_ENV
          echo "UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py" >> $GITHUB_ENV

      - name: 配置 Git
        run: |
          git config --global user.name "zzh20188"
          git config --global user.email "BuildGkiKernel@gmail.com"
      
      - name: 密钥设置——已经过mkppk修改
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        run: |
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > ./kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
            echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> $GITHUB_ENV

      - name: 安装仓库
        run: |
          # Install dependencies
          mkdir -p ./git-repo
          curl https://storage.googleapis.com/git-repo-downloads/repo > ./git-repo/repo
          chmod a+rx ./git-repo/repo
          echo "REPO=$GITHUB_WORKSPACE/./git-repo/repo" >> $GITHUB_ENV

      - name: 克隆 AnyKernel3 和其他依赖项
        run: |
          echo "Cloning AnyKernel3 and other dependencies..."

          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          SUSFS_COMMIT="9a8a553adba2b91aaa137be5ffad4dab0aea7eb0"
          # Debug print the branches
          echo "Using branch for SUSFS: $SUSFS_BRANCH"

          # Clone repositories using the branch names
          git clone https://github.com/WildPlusKernel/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          # cd susfs4ksu  
          #git fetch --depth 1 origin "$SUSFS_COMMIT"
          #git checkout "$SUSFS_COMMIT"
          #cd ..
          # git clone https://github.com/WildKernels/kernel_patches.git
          git clone https://github.com/Ante0/kernel_patches.git
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          # git clone https://github.com/tan666000/nom.git
          git clone https://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@github.com/tan666000/nom.git
          # next修复补丁
          # git clone https://github.com/tan666000/Super-Builders.git
          # git clone https://github.com/maxsteeel/nomount.git
          git clone -b dev https://github.com/maxsteeel/nomount.git
          #cd nomount
          #git fetch --depth 1 origin bf285bad4866f6ca4aff6cc773386677b0d2ca93
          #git checkout bf285bad4866f6ca4aff6cc773386677b0d2ca93
          #cd ..
          # git clone https://github.com/tan666000/nomount.git
          # git clone https://github.com/tan666111/yuanmokuai.git
          git clone https://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@github.com/tan666000/GKI_KernelSU_SUSFS.git zzh_patch
          git clone https://github.com/Numbersf/Action-Build.git --depth=1
          # git clone  https://github.com/zzh20188/GKI_KernelSU_SUSFS.git zzh_patch
          git clone -b master https://github.com/tan666111/momo.git
          # git clone -b dev https://github.com/tan666000/nomount.git
          # git clone https://github.com/chicknsoup/kernel_patches.git
          # git clone -b v3.1 https://github.com/tan666000/gkiboot.git
          git clone -b cpu2 https://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@github.com/tan666000/gkiboot.git cpu2
          git clone -b v3.1 https://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@github.com/tan666000/gkiboot.git bootid
          git clone -b neichun2 https://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@github.com/tan666000/gkiboot.git neichun2
          git clone https://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@github.com/tan666000/jiankong.git
          git clone https://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@github.com/tan666000/cpumei.git
          git clone https://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@github.com/tan666000/metis.git
          git clone https://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@github.com/tan666000/congdingxiang.git
          git clone https://github.com/tan666222/cpu2
      - name: 设置 CONFIG 环境变量
        run: |
          # Set CONFIG dynamically based on inputs values
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"
          echo "KERNEL_ROOT=$KERNEL_ROOT" >> $GITHUB_ENV
          # Set CONFIG as an environment variable for future steps
          

          echo "CONFIG set to: $CONFIG"

      
      - name: 初始化和同步内核源代码
        if: ${{ inputs.Latest }}
  
        run: |
          BUILD_FOLDER="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          echo "Creating folder for configuration: ${BUILD_FOLDER}..."
          mkdir -p "${BUILD_FOLDER}"
          cd "${BUILD_FOLDER}"
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git gcc
          ls gcc/bin
          # Initialize and sync kernel source
          echo "Initializing and syncing kernel source..."
          
          REPO_BRANCH="common-${{ inputs.os_patch_level }}"

          if [ -n "${{ inputs.revision }}" ]; then
            REPO_BRANCH="${{ inputs.revision }}"
          fi
          
          $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest -b $REPO_BRANCH --repo-rev=v2.16
          
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${REPO_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< $REMOTE_BRANCH; then
            echo "Found deprecated branch: $REPO_BRANCH"
            sed -i "s/\"${REPO_BRANCH}\"/\"deprecated\/${REPO_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          fi
          $REPO --version
          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast
          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV

          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          if grep -q deprecated <<< "$REMOTE_BRANCH" && \
             { [ "$FORMATTED_BRANCH" == "android13-5.15" ] && \
               [ ${{ inputs.sub_level }} -lt 123 ]; }; then
            echo '修复5.15仅支持旧版C库的BUG'
            cd ./common
            curl -LSsO https://github.com/zzh20188/GKI_KernelSU_SUSFS/raw/refs/heads/dev/5.15-patch/fix_5.15.legacy.patch
            patch -p1 < fix_5.15.legacy.patch
          fi
      - name: 应用 Stock Config 伪装
        if: ${{ inputs.Specified }}
        run: |
          STOCK_SRC="$GITHUB_WORKSPACE/config/stock_defconfig"
          STOCK_DST="$KERNEL_ROOT/common/arch/arm64/configs/stock_defconfig"

          if [ ! -f "$STOCK_SRC" ]; then
            echo "未检测到 $STOCK_SRC，跳过 Stock Config 伪装。"
            exit 0
          fi

          mkdir -p "$(dirname "$STOCK_DST")"
          if ! cp "$STOCK_SRC" "$STOCK_DST"; then
            echo "::error::复制 stock_defconfig 失败: $STOCK_SRC -> $STOCK_DST"
            exit 1
          fi
          echo "已复制 stock_defconfig -> $STOCK_DST"

          NEW_RULE='$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE'
          OLD_RULE='$(obj)/config_data: $(KCONFIG_CONFIG) FORCE'
          TARGET_MAKEFILE="$KERNEL_ROOT/common/kernel/Makefile"

          if [ ! -f "$TARGET_MAKEFILE" ]; then
            echo "::error::未找到 $TARGET_MAKEFILE"
            exit 1
          fi

          if grep -qF "$NEW_RULE" "$TARGET_MAKEFILE"; then
            echo "config_data 规则已是 stock_defconfig，跳过。"
          elif grep -qF "$OLD_RULE" "$TARGET_MAKEFILE"; then
            sed -i 's|$(obj)/config_data: $(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$TARGET_MAKEFILE"
            echo "已替换 config_data 规则: $TARGET_MAKEFILE"
          else
            echo "::error::未在 $TARGET_MAKEFILE 找到规则: $OLD_RULE"
            exit 1
          fi

      - name: 1初始化和同步内核源代码
        if: ${{ inputs.Specified }}
        run: |
          echo "Creating folder for configuration: $CONFIG..."
          mkdir -p "$CONFIG"
          cd "$CONFIG"
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git gcc
          ls gcc/bin
          # Initialize and sync kernel source
          echo "Initializing and syncing kernel source..."
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          $REPO init --depth=1 --u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          # Check if branch is deprecated
          if grep -q deprecated <<< $REMOTE_BRANCH; then
            echo "Found deprecated branch: $FORMATTED_BRANCH"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          fi
          # Sync repo and apply patches
          $REPO --version
          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast
          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV

          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          if grep -q deprecated <<< "$REMOTE_BRANCH" && \
             { [ "$FORMATTED_BRANCH" == "android13-5.15" ] && \
               [ ${{ inputs.sub_level }} -lt 123 ]; }; then
            echo '修复5.15仅支持旧版C库的BUG'
            cd ./common
            curl -LSsO https://github.com/zzh20188/GKI_KernelSU_SUSFS/raw/refs/heads/dev/5.15-patch/fix_5.15.legacy.patch
            patch -p1 < fix_5.15.legacy.patch
          fi   
      
      - name: Apply ptrace patch for older kernels
       # if: fromJSON(inputs.kernel_version) < 5.16
        run: |
          cd "$CONFIG/common"
          patch -p1 -F 3 < "../../kernel_patches/gki_ptrace.patch"
          # patch -p1 -F 3 < "../../kernel_patches/gki_mo.patch"

      
      - name: 确定 KernelSU 的分支
        run: |
         branch_input="${{ inputs.kernelsu_branch }}"
         variant_input="${{ inputs.kernelsu_variant }}"
         custom_banben="${{ inputs.banben }}"

         # 优先使用自定义分支（只要填写了就覆盖）
         if [ -n "$custom_banben" ]; then
            echo "BRANCH=-s $custom_banben" >> $GITHUB_ENV
            echo "使用自定义分支: $custom_banben"
            exit 0
         fi

         # 没有自定义分支时，使用预定义选项
         case "$branch_input" in
            "Stable(标准)")
               case "$variant_input" in
                  "Next")
                     echo "BRANCH=-s next" >> $GITHUB_ENV
                     ;;
                  "SukiSU")
                     echo "BRANCH=-s susfs-main" >> $GITHUB_ENV
                     ;;
                  *)
                     echo "BRANCH=-" >> $GITHUB_ENV
                     ;;
               esac
               ;;
            "Dev(开发)")
               case "$variant_input" in
                  "Official" | "MKSU") echo "BRANCH=-s main" >> $GITHUB_ENV ;;
                  "Next")              echo "BRANCH=-s dev" >> $GITHUB_ENV ;;
                  "SukiSU")            echo "BRANCH=-s main" >> $GITHUB_ENV ;;
                  "rsuntk")            echo "BRANCH=-s susfs-rksu-master" >> $GITHUB_ENV ;;
                  *) 
                     echo "错误：未定义开发分支的变体 '$variant_input'" >&2
                     exit 1
                     ;;
               esac
               ;;
            "Other(其他/指定)")
               # 如果走到这里，说明选择了 Other 但 banben 为空
               echo "错误：选择了 Other(其他/指定)，但未提供自定义分支名" >&2
               exit 1
               ;;
            *)
               echo "错误：未识别的分支类型 '$branch_input'" >&2
               exit 1
               ;;
         esac
      - name: 添加 KernelSU
        run: |
          echo "更改为配置目录: $CONFIG..."
          cd "$CONFIG"

          if [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "Adding KernelSU Official..."
            # curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash  $BRANCH
            curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/master/kernel/setup.sh" | bash -s master
          
          elif [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "Adding KernelSU Next..."
            # curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s $BRANCH
            # curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh" | bash  $BRANCH
             curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh" | bash -s dev
             
          elif [ "${{ inputs.kernelsu_variant }}" == "MKSU" ]; then
            echo "Adding KernelSU MKSU..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash $BRANCH
          
            curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/dev/kernel/setup.sh" | bash  $BRANCH
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "Adding KernelSU SukiSU..."
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash  $BRANCH
            
          elif [ "${{ inputs.kernelsu_variant }}" == "rsuntk" ]; then
            echo "Adding KernelSU www..."
            curl -LSs "https://raw.githubusercontent.com/tan666000/KernelSU/main/kernel/setup.sh" | bash $BRANCH
            curl -LSs "https://raw.githubusercontent.com/tan666000/KernelSU/main/kernel/setup.sh" | bash $BRANCH
       
          fi
      
      - name: 为 KernelSU 变体安装 SUSFS 补丁
        if: ${{ inputs.susfs }}
        run: |
         echo "更改为配置目录: $CONFIG..."
         cd "$CONFIG"
         
         echo "Applying SUSFS patches..."
         
         # Copy SUSFS patches
         cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
         cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
         cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
         
         if [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
           echo "Applying SUSFS patches for Official KernelSU..."
           cd ./KernelSU
           cp ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./ 
           patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
           
             # cp ../../kernel_patches/wild/ksun-293ca01-susfs-v2.1.0-a14-6.1-ef16cbce.patch ./
           # patch -p1 --forward < ksun-293ca01-susfs-v2.1.0-a14-6.1-ef16cbce.patch || true
         
         elif [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
           # 临时恢复KSU-NEXT的dev编译
           
           cd ./KernelSU-Next
           cp ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./ 
           patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
            # Step 2: 复制修复补丁
           cp ../../kernel_patches/next/susfs_fix_patches/v2.2.0/*.patch ./
           for file in $(find ./ -name "*.rej" 2>/dev/null | sed 's/\.rej$//'); do
               base_name=$(basename "$file")
               fix_patch="fix_${base_name}.patch"
               if [ -f "$fix_patch" ]; then
                  echo "Fixing $base_name with $fix_patch"
                  patch -p1 --forward < "$fix_patch" || true
               fi
            done
            
            patch -p1 --forward < overwrite_hook_mode.patch || true
            patch -p1 --forward < ksu_toolkit.patch || true
            
           #  echo "Applying SUSFS patches for 6666.."
          elif [ "${{ inputs.kernelsu_variant }}" == "Ne6xt" ]; then
               # 临时恢复KSU-NEXT的dev编译
             cd ./KernelSU-Next
             cp ../../kernel_patches/wild/ksun-c2013a15-susfs-f7ae19ef-gki.patch ./
             patch -p1 --forward < ksun-c2013a15-susfs-f7ae19ef-gki.patch || true
             echo "=== Checking for .rej files ==="
             find . -name "*.rej" -exec cat {} \;
           # Fix rejects from adding susfs to KSUN
           #cp ../../kernel_patches/next/susfs_fix_patches/v2.1.0/*.patch .
           
          # for p in *.patch; do
               # patch -p1 < "$p" || true
              # rm -f "$p"
          # done
           
           
         elif [ "${{ inputs.kernelsu_variant }}" == "MKSU" ]; then
           echo "Applying SUSFS patches for MKSU..."
           cd ./KernelSU
           cp ../../nomount/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
           patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
         
         elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
           echo "Applying SUSFS patches for SukiSU..."
           cd ./KernelSU
          # echo "Applying SukiSU specific SUSFS patch..."
          # cp ../../nomount/kernel/nomount_kernel_integration.patch ./
         #  patch -p1 --forward < nomount_kernel_integration.patch
          
         elif [ "${{ inputs.kernelsu_variant }}" == "rsuntk" ]; then
           echo "Applying SUSFS patches for MKSU..."
          
           cd ./KernelSU
           cp ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./ 
           patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
         
           
         else
           echo "Invalid KernelSU variant selected!"
           exit 1
         fi
         
         cd ../common
         
