
name: 编译内核a12-5-10

permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions
  
on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        # description: "选择 KernelSU | 注意:选中MKSU时为标准版"
        description: "选择 KernelSU"
        required: true
        type: choice
        options:
          - Official
          - Next
          - MKSU
          - SukiSU
          - rsuntk
        default: SukiSU
      kernelsu_branch:
        description: "选择 ksu 分支"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Other(其他/指定)
        default: Other(其他/指定)
      banben:
        description: '留空就是上面的'
        required: false
        type: string
      # kernelsu_branch_other:
      #   description: "如果选择了 “其他”，请指定您的自定义分支"
      #   required: false
      #   type: string  # This input is required if 'Other' is chosen
      version:
        description: '自定义版本名(如5.10.198后面的字符/留空则使用默认版本号)'
        required: false
        type: string
      build_time:
        description: '设置内核构建时间(格式见仓库说明)'
        required: false
        type: string
      use_zram:
        description: '是否开启增加更多ZRAM算法?'
        required: false
        type: boolean
        default: false
      use_kpm:
        description: '是否开启KPM功能?'
        required: false
        type: boolean
        default: false
      get_manager:
        description: '获取最新KSU管理器和SUS模块?'
        required: false
        type: boolean
        default: false
      onlyAk3:
        description: '仅上传AK3压缩包?(无boot,下载更快)'
        required: true
        type: boolean
        default: true
      Latest:
        description: '编译最新版本'
        required: true
        type: boolean
        default: true
      Specified:
        description: '指定版本'
        required: false
        type: boolean
        default: false
      susfs:
        description: '开启susfs'
        required: true
        type: boolean
        default: true
      zeromou:
        description: 'zeromou'
        required: false
        type: boolean
        default: false
      nomou:
        description: 'nomou'
        required: false
        type: boolean
        default: false
      

jobs:
  build-kernel-a12-5-10:
    uses: ./.github/workflows/kernel-a12-5.10.yml
    secrets: inherit
    with:
      make_release: false
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      # kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      use_kpm: ${{ inputs.use_kpm }}
      onlyAk3: ${{ inputs.onlyAk3 }}
      build_time: ${{ inputs.build_time }}
      Latest: ${{ inputs.Latest }}
      Specified: ${{ inputs.Specified }}
      susfs: ${{ inputs.susfs }}
      banben: ${{ inputs.banben }}
      zeromou: ${{ inputs.zeromou }}
      nomou: ${{ inputs.nomou }}
      
  get-ksu-manager:
    if: ${{ inputs.get_manager }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}

